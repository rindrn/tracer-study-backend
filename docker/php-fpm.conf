; Pool php-fpm untuk VPS 2 GB.
;
; Hitungannya: memory_limit 512M adalah plafon, pemakaian nyata per request
; API sekitar 60-90 MB. 6 child x ~90 MB = ~540 MB, masih menyisakan ruang
; untuk Postgres, Cube, dan Redis di mesin yang sama. Kalau naik ke VPS 4 GB,
; pm.max_children boleh dinaikkan ke 12.
[www]
; Kunci plafon memori request web di 512M. php.ini memasang 2G untuk keperluan
; CLI (etl:run), dan nilai itu berbahaya kalau ikut berlaku pada 6 child
; php-fpm sekaligus -- satu request bermasalah bisa menghabiskan RAM VPS.
; php_admin_value tidak bisa ditimpa ini_set dari dalam aplikasi.
php_admin_value[memory_limit] = 512M

pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Daur ulang child setiap 500 request sebagai jaring pengaman kebocoran
; memori pada import Excel yang panjang.
pm.max_requests = 500

; Log worker yang lambat -- berguna saat menelusuri query Cube yang menggantung.
slowlog = /dev/stderr
request_slowlog_timeout = 15s

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
