; Konfigurasi PHP produksi SmartTracer.

; 2G ini untuk jalur CLI, bukan untuk request web.
;
; etl:run memadatkan seluruh tracer_oltp menjadi 11 dim_* dan 3 fact_* dalam
; satu proses; cara-jalanin.md sendiri mewajibkan `php -d memory_limit=2G`
; karena batas kecil membuatnya mati di tengah jalan. RunEtlJob tidak memasang
; ini_set sendiri, jadi nilainya harus datang dari sini -- kalau tidak, worker
; dan scheduler mati diam-diam saat ETL mingguan.
;
; Request web TIDAK ikut sebesar ini: php-fpm.conf menguncinya di 512M lewat
; php_admin_value, cukup untuk import Excel 1800 baris lewat maatwebsite/excel.
memory_limit = 2G

; Import/export Excel besar bisa lewat 60 detik. Angka ini harus <= timeout
; fastcgi di nginx, kalau tidak nginx yang putus duluan dan pesan errornya
; jadi 504 tanpa jejak di log Laravel.
max_execution_time = 300
max_input_time = 300

upload_max_filesize = 20M
post_max_size = 25M

expose_php = Off
date.timezone = Asia/Jakarta

; Error tidak pernah ditampilkan ke response; Laravel yang mencatat ke log.
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Kode tidak berubah di dalam container, jadi cek timestamp file hanya buang
; syscall. Konsekuensinya: setiap deploy WAJIB restart container app.
opcache.validate_timestamps = 0
opcache.save_comments = 1
