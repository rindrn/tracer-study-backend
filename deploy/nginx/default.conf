# ---------------------------------------------------------------------------
# nginx edge SmartTracer -- satu-satunya container yang membuka port ke publik.
#
# Pembagian jalur:
#   /            -> container frontend (SPA statis)
#   /api, /sanctum -> php-fpm Laravel
#   /storage     -> berkas publik Laravel (hasil storage:link)
# Cube tidak punya jalur ke luar sama sekali. FE tidak pernah memanggil Cube
# langsung; Laravel yang meneruskan query dengan JWT, jadi port 4000 cukup
# hidup di jaringan internal Docker.
# ---------------------------------------------------------------------------

upstream php_backend {
    server app:9000;
}

server {
    listen 80;
    server_name _;

    # Ukuran ini harus >= post_max_size di php.ini (25M), kalau tidak import
    # Excel besar ditolak nginx sebelum sampai ke Laravel.
    client_max_body_size 25M;

    # Header keamanan dasar. HSTS sengaja tidak dipasang di sini -- tambahkan
    # setelah HTTPS benar-benar aktif, kalau tidak domain terkunci ke https
    # sementara sertifikat belum ada.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    root /var/www/html/public;

    # --- API Laravel ------------------------------------------------------
    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    # Sanctum memasang route CSRF cookie di luar prefix /api.
    location ^~ /sanctum/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /storage/ {
        try_files $uri =404;
        expires 7d;
    }

    location = /index.php {
        # internal: /index.php tidak boleh dipanggil langsung dari luar,
        # hanya lewat try_files di atas.
        internal;
        include fastcgi_params;
        fastcgi_pass php_backend;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;

        # Lebih longgar dari max_execution_time PHP (300s) supaya PHP yang
        # menghentikan request lebih dulu dan errornya terbaca di log Laravel,
        # bukan muncul sebagai 504 kosong dari nginx.
        fastcgi_read_timeout 330s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # --- Frontend SPA -----------------------------------------------------
    location / {
        proxy_pass http://fe:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
