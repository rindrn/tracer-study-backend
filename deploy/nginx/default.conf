# ---------------------------------------------------------------------------
# nginx edge SmartTracer -- satu-satunya container yang membuka port ke publik.
#
# Pembagian jalur:
#   /            -> container frontend (SPA statis)
#   /api, /sanctum -> php-fpm Laravel
#   /storage     -> berkas publik Laravel (hasil storage:link)
# Cube tidak punya jalur ke luar sama sekali. FE tidak pernah memanggil Cube
# langsung; Laravel yang meneruskan query dengan JWT, jadi port 4000 cukup
# hidup di jaringan internal Docker.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# HTTP -> HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name smart-tracer.id www.smart-tracer.id;

    # Let's Encrypt membutuhkan endpoint ini tetap tersedia melalui HTTP
    # untuk proses validasi dan renewal sertifikat.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Semua trafik HTTP selain ACME diarahkan ke HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name smart-tracer.id www.smart-tracer.id;

    # Sertifikat Let's Encrypt.
    ssl_certificate /etc/letsencrypt/live/smart-tracer.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smart-tracer.id/privkey.pem;

    # DNS embedded Docker (127.0.0.11) dipakai lewat variable di
    # fastcgi_pass/proxy_pass di bawah supaya nginx resolve ulang IP app/fe
    # tiap kali cache TTL habis. Tanpa ini nginx hanya resolve sekali saat
    # start/reload -- kalau container app atau fe di-restart sendiri (dapat
    # IP baru dari Docker) tanpa nginx ikut restart, semua request ke
    # upstream itu akan 502 "Connection refused" ke IP lama.
    resolver 127.0.0.11 valid=10s;

    # Ukuran ini harus >= post_max_size di php.ini (25M), kalau tidak import
    # Excel besar ditolak nginx sebelum sampai ke Laravel.
    client_max_body_size 25M;

    # Header keamanan dasar.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS diaktifkan setelah HTTPS benar-benar aktif.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    root /var/www/html/public;

    # --- API Laravel ------------------------------------------------------
    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    # Sanctum memasang route CSRF cookie di luar prefix /api.
    location ^~ /sanctum/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /storage/ {
        try_files $uri =404;
        expires 7d;
    }

    location = /index.php {
        # internal: /index.php tidak boleh dipanggil langsung dari luar,
        # hanya lewat try_files di atas.
        internal;
        include fastcgi_params;
        set $php_backend app:9000;
        fastcgi_pass $php_backend;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;

        # Lebih longgar dari max_execution_time PHP (300s) supaya PHP yang
        # menghentikan request lebih dulu dan errornya terbaca di log Laravel,
        # bukan muncul sebagai 504 kosong dari nginx.
        fastcgi_read_timeout 330s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # --- Frontend SPA -----------------------------------------------------
    location / {
        set $fe_backend http://fe:80;
        proxy_pass $fe_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# ---------------------------------------------------------------------------
# Metabase -- analyst.smart-tracer.id
# Metabase hanya dapat diakses melalui Nginx, bukan langsung dari port 3000.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name analyst.smart-tracer.id;

    # Let's Encrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name analyst.smart-tracer.id;

    ssl_certificate /etc/letsencrypt/live/analyst.smart-tracer.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analyst.smart-tracer.id/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Lihat penjelasan resolver di server block smart-tracer.id di atas.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $metabase_backend http://metabase:3000;
        proxy_pass $metabase_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
