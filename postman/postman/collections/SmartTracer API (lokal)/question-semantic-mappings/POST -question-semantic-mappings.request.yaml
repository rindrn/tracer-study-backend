$kind: http-request
name: POST /question-semantic-mappings
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Transactional\QuestionSemanticMappingController@store
  Sumber aturan: kelas validator terpisah

  Field body:
  - questionnaire_id (wajib): required, integer, exists:oltp.questionnaires,id
  - question_code (wajib): required, string, max:80
  - semantic_role (wajib): required, string, max:50, exists:oltp.semantic_role_registry,role_key
  - force_replace (opsional): nullable, boolean
url: "{{baseUrl}}/question-semantic-mappings"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "force_replace": true,
      "question_code": "KODE01",
      "questionnaire_id": 1,
      "semantic_role": "KODE01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 2000
