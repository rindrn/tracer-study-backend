$kind: http-request
name: POST /auth/alumni-login
description: |-
  Guard: public
  Controller: App\Http\Controllers\Api\Auth\AlumniAuthController@login
  Sumber aturan: validate() di controller

  Field body:
  - nim_or_email (wajib): required, string
  - password (wajib): required, string
url: "{{baseUrl}}/auth/alumni-login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nim_or_email": "{{alumniNim}}",
      "password": "{{alumniPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('login berhasil', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const token = body && body.data && body.data.token;
      if (token) {
        pm.collectionVariables.set('alumniToken', token);
        console.log('Token tersimpan ke variabel alumniToken');
      } else {
        console.warn('Token tidak ditemukan di respons');
      }
    language: text/javascript
order: 2000
