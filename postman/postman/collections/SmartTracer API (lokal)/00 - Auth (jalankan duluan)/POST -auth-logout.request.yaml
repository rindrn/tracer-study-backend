$kind: http-request
name: POST /auth/logout
description: |-
  Guard: staff
  Controller: App\Http\Controllers\Api\Auth\AuthController@logout
  Endpoint ini tidak memvalidasi body - kirim tanpa isi.
url: "{{baseUrl}}/auth/logout"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 5000
