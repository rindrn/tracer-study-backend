$kind: http-request
name: POST /auth/change-password
description: |-
  Guard: staff
  Controller: App\Http\Controllers\Api\Auth\AuthController@changePassword
  Sumber aturan: validate() di controller

  Field body:
  - current_password (wajib): required, string
  - new_password (wajib): required, string, min:8, confirmed
url: "{{baseUrl}}/auth/change-password"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "current_password": "rahasia123",
      "new_password": "rahasia123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 4000
