$kind: http-request
name: POST /lams
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Transactional\LamController@store
  Sumber aturan: kelas validator terpisah

  Field body:
  - name (wajib): required, string, max:100
  - code (wajib): required, string, max:20, unique:oltp.lams,code
  - program_ids (opsional): nullable, array
  - program_ids.* (opsional): integer, exists:oltp.programs,id
url: "{{baseUrl}}/lams"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "code": "KODE01",
      "name": "Contoh",
      "program_ids": [
        1
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 2000
