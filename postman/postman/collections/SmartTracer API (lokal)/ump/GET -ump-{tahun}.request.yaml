$kind: http-request
name: GET /ump/{tahun}
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Transactional\RefUmpController@show
url: "{{baseUrl}}/ump/:tahun"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
pathVariables:
  - key: tahun
    value: "1"
    description: isi dengan id yang ada di basis data
scripts:
