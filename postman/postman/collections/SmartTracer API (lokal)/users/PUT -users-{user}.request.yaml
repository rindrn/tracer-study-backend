$kind: http-request
name: PUT /users/{user}
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Transactional\UserController@update
  Sumber aturan: validate() di controller

  Field body:
  - name (wajib): required, string, max:255
  - email (wajib): required, email, oltp.users, email, exists
  - password (opsional): nullable, string, min:6
  - role (wajib): required
  - program_id (opsional): nullable, integer, exists:oltp.programs,id
  - jurusan (opsional): nullable, string, max:100
  - jurusan_id (opsional): required_if:role,
  - fakultas_id (opsional): required_if:role,
url: "{{baseUrl}}/users/:user"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
pathVariables:
  - key: user
    value: "1"
    description: isi dengan id yang ada di basis data
body:
  type: json
  content: |-
    {
      "email": "nama@contoh.ac.id",
      "jurusan": "contoh",
      "name": "Contoh",
      "password": "rahasia123",
      "program_id": 1,
      "role": "ISI_SESUAI_ENUM"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 5000
