$kind: http-request
name: PUT /lam-versions/{id}/thresholds/bulk
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Transactional\ThresholdController@bulkUpdate
  Sumber aturan: kelas validator terpisah

  Field body:
  - thresholds (wajib): required, array, min:1
  - thresholds.*.indicator_id (wajib): required, integer, exists:oltp.threshold_indicators,id
  - thresholds.*.baik_id (wajib): required, integer, exists:oltp.thresholds,id
  - thresholds.*.baik_value (opsional): nullable, numeric, min:0, max:100
  - thresholds.*.unggul_id (wajib): required, integer, exists:oltp.thresholds,id
  - thresholds.*.unggul_value (opsional): nullable, numeric, min:0, max:100
  - thresholds.*.param_value (opsional): nullable, numeric, min:0
url: "{{baseUrl}}/lam-versions/:id/thresholds/bulk"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
pathVariables:
  - key: id
    value: "1"
    description: isi dengan id yang ada di basis data
body:
  type: json
  content: |-
    {
      "thresholds": [
        {
          "baik_id": 1,
          "baik_value": 0,
          "indicator_id": 1,
          "param_value": 0,
          "unggul_id": 1,
          "unggul_value": 0
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 7000
