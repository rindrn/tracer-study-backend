$kind: http-request
name: PUT /lam-versions/{id}
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Transactional\LamVersionController@update
  Sumber aturan: kelas validator terpisah

  Field body:
  - version_name (opsional): nullable, string, max:100
  - is_active (opsional): nullable, boolean
url: "{{baseUrl}}/lam-versions/:id"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
pathVariables:
  - key: id
    value: "1"
    description: isi dengan id yang ada di basis data
body:
  type: json
  content: |-
    {
      "is_active": true,
      "version_name": "Contoh"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 3000
