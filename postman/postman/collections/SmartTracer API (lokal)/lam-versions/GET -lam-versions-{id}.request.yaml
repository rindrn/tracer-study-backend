$kind: http-request
name: GET /lam-versions/{id}
description: |-
  Guard: staff
  Controller: App\Http\Controllers\Api\Transactional\LamVersionController@show
url: "{{baseUrl}}/lam-versions/:id"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
pathVariables:
  - key: id
    value: "1"
    description: isi dengan id yang ada di basis data
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 2000
