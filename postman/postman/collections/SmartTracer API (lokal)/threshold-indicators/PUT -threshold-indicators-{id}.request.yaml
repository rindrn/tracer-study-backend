$kind: http-request
name: PUT /threshold-indicators/{id}
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Transactional\ThresholdIndicatorController@update
  Sumber aturan: diisi manual dari ThresholdIndicatorValidator

  Field body:
  - name (wajib): sometimes, required, string, max:100
  - unit (wajib): sometimes, required, string, max:20
  - operator (wajib): sometimes, required, string, in:>=,<=,>,<,=
  - description (opsional): nullable, string
  - dynamic_param_unit (opsional): nullable, string, max:20
url: "{{baseUrl}}/threshold-indicators/:id"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
pathVariables:
  - key: id
    value: "1"
    description: isi dengan id yang ada di basis data
body:
  type: json
  content: |-
    {
      "description": "contoh",
      "dynamic_param_unit": "contoh",
      "name": "Contoh",
      "operator": ">=",
      "unit": "contoh"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 2000
