$kind: http-request
name: DELETE /questionnaires/{questionnaire}
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Transactional\QuestionnaireController@destroy
url: "{{baseUrl}}/questionnaires/:questionnaire"
method: DELETE
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
pathVariables:
  - key: questionnaire
    value: "1"
    description: isi dengan id yang ada di basis data
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 4000
