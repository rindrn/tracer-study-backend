$kind: http-request
name: POST /approvals/request-delete
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer,tracer_team
  Controller: App\Http\Controllers\Api\Transactional\ApprovalController@requestDelete
  Sumber aturan: validate() di controller

  Field body:
  - questionnaire_id (wajib): required, integer
  - title (wajib): required, string
  - note (wajib): required, string
url: "{{baseUrl}}/approvals/request-delete"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "note": "contoh",
      "questionnaire_id": 1,
      "title": "Contoh"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 4000
