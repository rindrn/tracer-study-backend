$kind: http-request
name: PUT /roles/{role}
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Transactional\RoleController@update
  Sumber aturan: validate() di controller

  Field body:
  - name (wajib): required, string, max:50, oltp.roles, name, exists
  - label (wajib): required, string, max:100
  - description (opsional): nullable, string, max:255
  - scope (opsional): nullable, string, max:100
url: "{{baseUrl}}/roles/:role"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
pathVariables:
  - key: role
    value: "1"
    description: isi dengan id yang ada di basis data
body:
  type: json
  content: |-
    {
      "description": "contoh",
      "label": "contoh",
      "name": 1,
      "scope": "contoh"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 3000
