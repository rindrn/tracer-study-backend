$kind: http-request
name: POST /alumni/{alumniId}/reset-response
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Admin\AlumniController@resetResponse
  Sumber aturan: validate() di controller

  Field body:
  - questionnaire_id (wajib): required, integer
url: "{{baseUrl}}/alumni/:alumniId/reset-response"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
pathVariables:
  - key: alumniId
    value: "1"
    description: isi dengan id yang ada di basis data
body:
  type: json
  content: |-
    {
      "questionnaire_id": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 3000
