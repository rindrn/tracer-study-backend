$kind: http-request
name: GET /alumni/{alumnus}
description: |-
  Guard: staff
  Controller: App\Http\Controllers\Api\Admin\AlumniController@show
url: "{{baseUrl}}/alumni/:alumnus"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
pathVariables:
  - key: alumnus
    value: "1"
    description: isi dengan id yang ada di basis data
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 4000
