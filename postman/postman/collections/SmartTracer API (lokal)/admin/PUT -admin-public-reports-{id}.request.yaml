$kind: http-request
name: PUT /admin/public-reports/{id}
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Admin\PublicReportController@update
  Sumber aturan: validate() di controller

  Field body:
  - title (opsional): sometimes, string, max:200
  - description (opsional): nullable, string, max:2000
  - report_year (opsional): sometimes, integer, min:1990, max:2100
  - is_published (opsional): sometimes, boolean
url: "{{baseUrl}}/admin/public-reports/:id"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
pathVariables:
  - key: id
    value: "1"
    description: isi dengan id yang ada di basis data
body:
  type: json
  content: |-
    {
      "description": "contoh",
      "is_published": true,
      "report_year": 2024,
      "title": "Contoh"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 6000
