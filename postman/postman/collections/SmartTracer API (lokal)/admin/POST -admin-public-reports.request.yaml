$kind: http-request
name: POST /admin/public-reports
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Admin\PublicReportController@store
  Sumber aturan: validate() di controller

  Field body:
  - title (wajib): required, string, max:200
  - description (opsional): nullable, string, max:2000
  - report_year (wajib): required, integer, min:1990, max:2100
  - is_published (opsional): nullable, boolean
  - file (wajib): required, file, mimes:pdf, max:
url: "{{baseUrl}}/admin/public-reports"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "description": "contoh",
      "file": "(kirim lewat form-data, bukan JSON)",
      "is_published": true,
      "report_year": 2024,
      "title": "Contoh"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 5000
