$kind: http-request
name: PATCH /admin/data-subject-requests/{id}
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Admin\DataSubjectRequestController@update
  Sumber aturan: validate() di controller

  Field body:
  - status (wajib): required, string, in:in_review,fulfilled,rejected
  - response (opsional): nullable, string, max:2000
url: "{{baseUrl}}/admin/data-subject-requests/:id"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
pathVariables:
  - key: id
    value: "1"
    description: isi dengan id yang ada di basis data
body:
  type: json
  content: |-
    {
      "response": "contoh",
      "status": "in_review"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 3000
