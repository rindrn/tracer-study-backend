$kind: http-request
name: POST /degrees
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Transactional\DegreeController@store
  Sumber aturan: validate() di controller

  Field body:
  - code (wajib): required, string, max:20
  - label (opsional): nullable, string, max:50
  - sort_order (opsional): nullable, integer, min:0, max:65535
  - is_active (opsional): nullable, boolean
url: "{{baseUrl}}/degrees"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "code": "KODE01",
      "is_active": true,
      "label": "contoh",
      "sort_order": 0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 1000
