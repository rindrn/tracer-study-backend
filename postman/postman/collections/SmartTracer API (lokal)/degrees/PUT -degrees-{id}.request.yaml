$kind: http-request
name: PUT /degrees/{id}
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Transactional\DegreeController@update
  Sumber aturan: validate() di controller

  Field body:
  - code (opsional): sometimes, string, max:20
  - label (opsional): sometimes, string, max:50
  - sort_order (opsional): sometimes, integer, min:0, max:65535
  - is_active (opsional): sometimes, boolean
url: "{{baseUrl}}/degrees/:id"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
pathVariables:
  - key: id
    value: "1"
    description: isi dengan id yang ada di basis data
body:
  type: json
  content: |-
    {
      "code": "KODE01",
      "is_active": true,
      "label": "contoh",
      "sort_order": 0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 3000
