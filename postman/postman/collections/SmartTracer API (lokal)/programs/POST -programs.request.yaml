$kind: http-request
name: POST /programs
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Transactional\ProgramController@store
  Sumber aturan: kelas validator terpisah

  Field body:
  - name (wajib): required, string, max:100
  - code (wajib): required, string, max:20
  - degree (wajib): required
  - is_active (opsional): sometimes, boolean
  - accreditation (opsional): sometimes, nullable, string, max:30
  - accredited_until (opsional): sometimes, nullable, date
url: "{{baseUrl}}/programs"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "accreditation": "contoh",
      "accredited_until": "2026-01-01",
      "code": "KODE01",
      "is_active": true,
      "name": "Contoh"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 2000
