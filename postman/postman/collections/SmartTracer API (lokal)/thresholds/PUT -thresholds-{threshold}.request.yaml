$kind: http-request
name: PUT /thresholds/{threshold}
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer,tracer_team
  Controller: App\Http\Controllers\Api\Transactional\ThresholdController@update
  Sumber aturan: kelas validator terpisah

  Field body:
  - value (wajib): required, numeric, min:0, max:100
url: "{{baseUrl}}/thresholds/:threshold"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
pathVariables:
  - key: threshold
    value: "1"
    description: isi dengan id yang ada di basis data
body:
  type: json
  content: |-
    {
      "value": 0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 6000
