$kind: http-request
name: POST /cities
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Transactional\RegionController@storeCity
  Sumber aturan: validate() di controller

  Field body:
  - province_code (wajib): required, string, max:10
  - code (wajib): required, string, max:10, unique:oltp.cities,code
  - name (wajib): required, string, max:150
url: "{{baseUrl}}/cities"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "code": "KODE01",
      "name": "Contoh",
      "province_code": "KODE01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 2000
