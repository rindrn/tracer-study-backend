$kind: http-request
name: PUT /cities/{id}
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Transactional\RegionController@updateCity
  Sumber aturan: validate() di controller

  Field body:
  - province_code (wajib): required, string, max:10
  - code (opsional): aturan dinamis
  - name (wajib): required, string, max:150
url: "{{baseUrl}}/cities/:id"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
pathVariables:
  - key: id
    value: "1"
    description: isi dengan id yang ada di basis data
body:
  type: json
  content: |-
    {
      "code": "ISI_MANUAL",
      "name": "Contoh",
      "province_code": "KODE01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 3000
