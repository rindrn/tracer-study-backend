$kind: http-request
name: PUT /fakultas/{id}/jurusans
description: |-
  Guard: staff
  Peran yang diizinkan: head_tracer
  Controller: App\Http\Controllers\Api\Transactional\FakultasController@syncJurusans
  Sumber aturan: validate() di controller

  Field body:
  - jurusan_ids (opsional): present, array
  - jurusan_ids.* (opsional): integer, exists:oltp.jurusans,id
url: "{{baseUrl}}/fakultas/:id/jurusans"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
pathVariables:
  - key: id
    value: "1"
    description: isi dengan id yang ada di basis data
body:
  type: json
  content: |-
    {
      "jurusan_ids": [
        1
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('tidak error server', () => pm.expect(pm.response.code).to.be.below(500));
      pm.test('respons JSON', () => pm.response.to.be.json);
    language: text/javascript
order: 5000
