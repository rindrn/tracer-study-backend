# database/dump/**: dump SQL data seed/dummy (akun @test.com, hash bcrypt sama
# semua) yang dipakai aktif oleh RealDataSeeder.php & alur deploy VPS
# (deploy/README.md). Bukan kredensial nyata, tapi polanya memicu rule
# secrets:S8215 (deteksi hash password) di setiap baris COPY users. Di-exclude
# dari analisis, bukan dihapus dari git -- filenya tetap wajib ada untuk
# db:seed --class=RealDataSeeder.
sonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,database/dump/**
